[project]
name = "codesage-service"
version = "0.1.0"
description = "FastAPI microservice that explains code snippets via streaming LLM responses"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "anthropic",
    "tenacity",
    "python-dotenv",
    "asyncpg",
    "pgvector",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
